### Placeholders
# Название поинта - %points_<key>_name%
# Название поинта в множественном числе - %points_<key>_name-plural%
# Символ поинта - %points_<key>_symbol%
# Цвет поинта - %points_<key>_color%
# Цвет поинта в mini message формате - %points_<key>_color-mm%
# Баланс - %points_<key>_balance%
# Форматированный баланс - %points_<key>_balance-format%
# Целочисленный баланс - %points_<key>_balance-int%
# Форматированный целочисленный баланс - %points_<key>_balance-int-format%

### Messages

## Info
info-point-balance: "<green>У вас есть %points_<key>_color-mm%<balance>%points_<key>_symbol%"
info-point-balance-other: "<green>Игрок '%player_name%' имеет %points_<key>_color-mm%<balance>%points_<key>_symbol%"
info-balance-set: "<green>Ваш баланс установлен на %points_<key>_color-mm%<amount>%points_<key>_symbol%"
info-balance-add: "<green>Ваш баланс пополнен на %points_<key>_color-mm%<amount>%points_<key>_symbol%"
info-balance-sub: "<red>С вашего баланса снято %points_<key>_color-mm%<amount>%points_<key>_symbol%"
info-point-receive: "<green>Получено %points_<key>_color-mm%<amount>%points_<key>_symbol% <green>от игрока '%player_name%'"
info-history-header: "<gold>Транзакции игрока '%player_name%', страница <page>:"
info-history-entry: "<gray>[<id>] <dark_gray><date> <white><type> %points_<key>_color-mm%<amount> <gray>баланс <white><balance> <dark_gray>(<source>) <gray><reason>"
info-history-empty: "<gray>На этой странице нет транзакций"
info-audit-result: "<green>Проверено балансов '<key>': <checked>, не совпадают с историей: <mismatches>"
info-audit-mismatch: "<red>У '<player-name>' сохранено <balance>, а по истории <ledger>"
info-delivery-duplicate: "<yellow>Выдача '<id>' игроку '<player-name>' уже была проведена, ничего не изменилось"
info-help:
  - "<gold>Команды InfPoints:"
  - "<yellow>/points balance (поинт) [игрок] <gray>- показать баланс"
  - "<yellow>/points pay (поинт) (игрок) (количество) <gray>- перевести другому игроку"
  - "<yellow>/points history (поинт) [игрок] [страница] <gray>- показать историю транзакций"
  - "<yellow>/points set|add|sub (поинт) (игроки) (количество) [sender-message] [receiver-message] [причина] <gray>- изменить балансы, игроки - ник, UUID или селектор вроде @a"
  - "<yellow>/points deliver (поинт) (игрок) (количество) (id) [причина] <gray>- выдать поинты не более одного раза на id выдачи"
  - "<yellow>/points exchange (поинт) (игрок) (количество) (команда) <gray>- списать поинты и выполнить команду от консоли"
  - "<yellow>/points audit (поинт) [игрок] <gray>- сверить сохраненные балансы с историей"
  - "<yellow>/points reload <gray>- перезагрузить плагин"

