### Placeholders
# Название монеты - %points_<key>_name%
# Название монеты в множественном числе - %points_<key>_name-plural%
# Символ монеты - %points_<key>_symbol%
# Баланс - %points_<key>_balance%
# Форматированный баланс - %points_<key>_balance-format%

### Messages

## Info
info-point-balance: "&aYou have %points_<key>_balance%%points_<key>_symbol%"
info-point-balance-other: "&aPlayer '%player_name%' have %points_<key>_balance%%points_<key>_symbol%"
info-help:
  - "Help"

## Error
error-point-not-found: "&cPoint '<key>' doesn't exist!"
error-insufficient-funds: "&cInsufficient funds!"
error-pay-self: "&cCan't pay to yourself!"
error-permissions: "&cNot enough permissions to execute this command!"

## Success
success-plugin-reload: "&aPlugin reloaded!"
success-point-set: "&aSet <amount>%points_<key>_symbol% to '<player-name>'"
success-point-add: "&aAdded <amount>%points_<key>_symbol% to '<player-name>'"
success-point-sub: "&aSubtracted <amount>%points_<key>_symbol% from '<player-name>'"
success-point-pay: "&aPayed <amount>%points_<key>_symbol% to '<player-name>'"

