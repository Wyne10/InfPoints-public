### Placeholders
# Point name - %points_<key>_name%
# Plural point name - %points_<key>_name-plural%
# Point symbol- %points_<key>_symbol%
# Point color - %points_<key>_color%
# Balance - %points_<key>_balance%
# Formatted balance - %points_<key>_balance-format%
# Integer balance - %points_<key>_balance-int%
# Formatted integer balance - %points_<key>_balance-int-format%

### Format
format-decimal: "#.##"

### Messages

## Info
info-point-balance: "&aYou have %points_<key>_color%%points_<key>_balance%%points_<key>_symbol%"
info-point-balance-other: "&aPlayer '%player_name%' has %points_<key>_color%%points_<key>_balance%%points_<key>_symbol%"
info-balance-set: "&aYour balance is set to %points_<key>_color%<amount>%points_<key>_symbol%"
info-balance-add: "&aYour balance has been replenished by %points_<key>_color%<amount>%points_<key>_symbol%"
info-balance-sub: "%points_<key>_color%<amount>%points_<key>_symbol% &chave been withdrawn from your balance"
info-help:
  - "Help"

## Error
error-point-not-found: "&cPoint '<key>' doesn't exist!"
error-insufficient-funds: "&cInsufficient funds!"
error-pay-self: "&cCan't pay to yourself!"
error-permissions: "&cNot enough permissions to execute this command!"

## Success
success-plugin-reload: "&aPlugin reloaded!"
success-point-set: "&aSet %points_<key>_color%<amount>%points_<key>_symbol% &ato '<player-name>'"
success-point-add: "&aAdded %points_<key>_color%<amount>%points_<key>_symbol% &ato '<player-name>'"
success-point-sub: "&aSubtracted %points_<key>_color%<amount>%points_<key>_symbol% &afrom '<player-name>'"
success-point-pay: "&aPayed %points_<key>_color%<amount>%points_<key>_symbol% &ato '<player-name>'"