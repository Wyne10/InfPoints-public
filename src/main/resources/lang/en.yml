### Placeholders
# Point name - %points_<key>_name%
# Plural point name - %points_<key>_name-plural%
# Point symbol - %points_<key>_symbol%
# Point color - %points_<key>_color%
# Point color in MiniMessage format - %points_<key>_color-mm%
# Balance - %points_<key>_balance%
# Formatted balance - %points_<key>_balance-format%
# Integer balance - %points_<key>_balance-int%
# Formatted integer balance - %points_<key>_balance-int-format%
#
# PlaceholderAPI placeholders such as %player_name% and %points_<key>_balance% are resolved for the player
# a message is about, which is the other player in messages like info-point-balance-other and info-point-receive,
# and the reader everywhere else. They need PlaceholderAPI installed, <player-name> works without it.

### Messages

## Info
info-point-balance: "<green>You have %points_<key>_color-mm%<balance>%points_<key>_symbol%"
info-point-balance-other: "<green>Player '%player_name%' has %points_<key>_color-mm%<balance>%points_<key>_symbol%"
info-balance-set: "<green>Your balance is set to %points_<key>_color-mm%<amount>%points_<key>_symbol%"
info-balance-add: "<green>Your balance has been replenished by %points_<key>_color-mm%<amount>%points_<key>_symbol%"
info-balance-sub: "%points_<key>_color-mm%<amount>%points_<key>_symbol% <red>have been withdrawn from your balance"
info-point-receive: "<green>Received %points_<key>_color-mm%<amount>%points_<key>_symbol% <green>from '%player_name%'"
info-history-header: "<gold>Transactions of '%player_name%', page <page>:"
info-history-entry: "<gray>[<id>] <dark_gray><date> <white><type> %points_<key>_color-mm%<amount> <gray>balance <white><balance> <dark_gray>(<source>) <gray><reason>"
info-history-empty: "<gray>No transactions on this page"
info-audit-result: "<green>Checked <checked> balances of '<key>', <mismatches> don't match their history"
info-audit-mismatch: "<red>'<player-name>' has <balance> stored, but <ledger> in the history"
info-delivery-duplicate: "<yellow>Delivery '<id>' to '<player-name>' was already applied, nothing changed"
info-help:
  - "<gold>InfPoints commands:"
  - "<yellow>/points balance (point) [player] <gray>- show a balance"
  - "<yellow>/points pay (point) (player) (amount) <gray>- pay another player"
  - "<yellow>/points history (point) [player] [page] <gray>- show the transaction history"
  - "<yellow>/points set|add|sub (point) (players) (amount) [sender-message] [receiver-message] [reason] <gray>- change balances, players can be a name, a UUID or a selector like @a"
  - "<yellow>/points deliver (point) (player) (amount) (id) [reason] <gray>- add points at most once per delivery id"
  - "<yellow>/points exchange (point) (player) (amount) (command) <gray>- take points and run a console command"
  - "<yellow>/points audit (point) [player] <gray>- compare stored balances with their history"
  - "<yellow>/points reload <gray>- reload the plugin"

