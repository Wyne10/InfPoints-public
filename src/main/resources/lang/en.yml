error-point-not-found: "<red>Point '<key>' doesn't exist!"
error-point-unavailable: "<red>'<key>' is unavailable right now, try again later!"
error-insufficient-funds: "<red>Insufficient funds!"
error-insufficient-funds-other: "<red>'%player_name%' has insufficient funds!"
error-invalid-amount: "<red>Invalid amount!"
error-invalid-delivery-id: "<red>A delivery id must contain 1 to <max> characters!"
error-pay-self: "<red>Can't pay to yourself!"
error-permissions: "<red>Not enough permissions to execute this command!"
error-transaction-cancelled: "<red>The operation was cancelled!"
