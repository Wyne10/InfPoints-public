include:
  - project: 'NeverMined-Entertainment/CI-CD'
    ref: master
    file: '.gitlab/workflows/master-deploy.yml'
    inputs:
      release: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
